<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto&display=swap" rel="stylesheet">
    <title>GALERIA</title>
</head>

<body>
    <header>
        <h2 class="logo">BRAULIO CARRILLO</h2>
        <input type="checkbox" id="check">
        <label for="check" class="mostrar-menu">
            &#8801
        </label>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="sobre-nosotros.html">Sobre Nosotros</a>
            <a href="galeria.html">Galeria</a>
            <a href="contacto.html">Contacto</a>
            <label for="check" class="esconder-menu">
                &#215
            </label>
        </nav>
    </header>

    <section id="banner" class="banner3">
        <div class="contenido-banner">
            <h3><span>Galeria</h3>
        </div>
    </section>
    
    <section id="personas">
        <div>
            <h4 class="about-title">Galeria sobre nuestra fauna</h4> 
        </div>
    </section>

    <section id="gallery">
        <div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/quetzal.jpg" alt="Quetzal" width="600" height="400">
                    <div class="desc">Quetzal</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/jilguero.webp" alt="Jilguero" width="600" height="400px">
                    <div class="desc">Jilguero</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/tucan_pecho_amarillo.jpg" alt="Tucan pecho amarillo" width="600" height="400">
                    <div class="desc">Tucan pecho amarillo</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/buitre-rey.jpg" alt="Buitre Rey" width="600" height="400">
                    <div class="desc">Buitre Rey</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/mono-carablanca.jpeg" alt="Mono carablanca" width="600" height="400">
                    <div class="desc">Mono carablanca</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/mono-aullador.jpg" alt="Mono aullador" width="600" height="400">
                    <div class="desc">Mono aullador</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/oso-colmenero.jpg" alt="Oso Colmenero" width="600" height="400">
                    <div class="desc">Oso Colmenero</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/puma.webp" alt="puma" width="600" height="400">
                    <div class="desc">Puma</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/jaguar.jpg" alt="Jaguar" width="600" height="400">
                    <div class="desc">Jaguar</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/danta.jpg" alt="Danta" width="600" height="400">
                    <div class="desc">Danta</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/cabro-de-monte.jpg" alt="Cabro de monte" width="600" height="400">
                    <div class="desc">Cabro de monte</div>
                </div>
            </div>
            <div class="responsive">
                <div class="gallery">
                    <img src="Imagenes/matabuey.jpg" alt="Matabuey" width="600" height="400">
                    <div class="desc">Matabuey</div>
                </div>
            </div>
        </div>
    </section>

    <section id="contacto">
        <h4>Contactenos</h4>
        <form action="#">
            <div class="datos-form">
                <div class="Nombre">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Nombre Apellidos">
                </div>
                <div class="Email">
                    <label for="email">Correo Electronico</label>
                    <input type="email" name="email" id="email" placeholder="ejemplo@gmail.com">
                </div>
            </div>

            <div class="Mensaje">
                <label for="mensaje">Mensaje</label>
                <textarea name="mensaje" id="mensaje" cols="30" rows="10" placeholder="Mensaje"></textarea>
            </div>

            <div class="boton-formulario">
                <a href="#" class="boton-saber-mas">Enviar Mensaje</a>
            </div>
        </form>

    </section>
<footer>
    <p>&copy;2025 Parque Nacional Braulio Carrillo</p>
</footer>
</body>
</html>
